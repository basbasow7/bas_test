name: Deploy Django to VPS

on:
  push:
    branches: [ main ]

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Connect, Check Python and Deploy to VPS
        run: |
          export SSHPASS='Tur57RMSFg3s'

          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -p 22 \
            root@153.75.82.12 \
            "
              echo 'Connected to VPS!' && \
              echo 'Checking Python...' && \
              if command -v python3 > /dev/null 2>&1; then
                echo 'Python is installed!'
                python3 --version
              else
                echo 'Python is NOT installed! Installing...'
                apt-get update && apt-get install -y python3-venv python3-pip git
              fi && \
              mkdir -p /var/www && \
              cd /var/www && \
              if [ ! -d 'proyekt' ]; then
                git clone https://github.com/basbasow7/bas_test.git proyekt
              fi && \
              cd proyekt && \
              git pull origin main && \
              python3 -m venv venv && \
              source venv/bin/activate && \
              pip install -r requirements.txt && \
              python manage.py migrate && \
              pkill -f 'manage.py runserver' || true && \
              nohup venv/bin/python manage.py runserver 0.0.0.0:8000 > /var/www/proyekt/server.log 2>&1 &
            "